<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蛋蛋学习派对">
<meta name="theme-color" content="#ffe0ec">
<title>蛋蛋学习派对 · 五年级</title>
<style>:root{
  --pink:#ff5c93;--pink2:#ff8fb6;--pinkD:#d63a72;--yellow:#ffc93c;--yellowD:#e29a14;--mint:#3fd0a0;--mintD:#1f9e75;
  --blue:#4fb0ff;--blueD:#2a7fd6;--purple:#9b7bff;--purpleD:#6c4ad8;--red:#ff5a6e;--redD:#d02c48;
  --ink:#3b2a4a;--ink2:#7a6890;--card:#fff;--line:#f1e4f2;
  --r-xl:34px;--r-lg:26px;--r-md:20px;--r-sm:14px;
  --sh-card:0 10px 30px -10px rgba(120,40,110,.28),0 2px 0 rgba(255,255,255,.9) inset;
  --font:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Maru Gothic ProN","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);font-size:clamp(15px,2.15vmin,21px);font-weight:600;
  background:radial-gradient(circle at 12% 8%,#fff6c9 0,transparent 34%),radial-gradient(circle at 92% 20%,#d9f1ff 0,transparent 36%),radial-gradient(circle at 60% 100%,#ffd8ec 0,transparent 50%),linear-gradient(160deg,#fff1f7,#f4ecff 55%,#e6f6ff);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(#ffffff 2.2px,transparent 2.6px);background-size:34px 34px}
textarea,input{-webkit-user-select:text;user-select:text;font-size:16px;font-family:var(--font)}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;font-size:inherit;font-weight:800;background:none;padding:0}
svg.ic{width:1.3em;height:1.3em;vertical-align:-.28em;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
/* ===== 顶栏 ===== */
#topbar{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;min-height:70px;position:relative;z-index:5}
.rbtn{width:56px;height:56px;border-radius:50%;background:linear-gradient(#fff,#f6eefb);color:var(--ink);box-shadow:0 5px 0 #e3cfe8,0 8px 14px -6px rgba(120,40,110,.35);display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .12s}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #e3cfe8}
#title{flex:1;font-weight:900;font-size:1.45em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);letter-spacing:.5px}
.pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#fff,#fbf4fd);border-radius:30px;padding:7px 16px 7px 8px;font-weight:900;box-shadow:0 4px 0 #ead8ee,0 6px 12px -6px rgba(120,40,110,.3);white-space:nowrap;font-size:1.05em}
.pill svg.ic{width:1.6em;height:1.6em}
.pill.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}
main{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 20px 30px;display:none}
.screen.on{display:block;animation:screenIn .42s cubic-bezier(.2,.9,.3,1.15)}
@keyframes screenIn{from{opacity:0;transform:scale(.965) translateY(10px)}to{opacity:1;transform:none}}
/* ===== 通用按钮/卡片 ===== */
.btn{--c1:#fff;--c2:#f5ecf9;--sd:#e2cfe8;--fg:var(--ink);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:62px;padding:12px 24px;border-radius:22px;font-weight:900;font-size:1.1em;color:var(--fg);
  background:linear-gradient(var(--c1),var(--c2));box-shadow:0 6px 0 var(--sd),0 10px 18px -8px rgba(80,20,80,.35);transition:transform .1s,box-shadow .1s;overflow:hidden}
.btn::after{content:"";position:absolute;left:10%;right:10%;top:5px;height:38%;border-radius:20px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sd),0 4px 8px -6px rgba(80,20,80,.35)}
.btn.pri{--c1:#ff8fb6;--c2:#ff5c93;--sd:var(--pinkD);--fg:#fff}
.btn.grn{--c1:#7ff0c4;--c2:#2fc48f;--sd:var(--mintD);--fg:#fff}
.btn.blu{--c1:#8fd0ff;--c2:#3d9ef5;--sd:var(--blueD);--fg:#fff}
.btn.org{--c1:#ffd970;--c2:#ffaa2b;--sd:var(--yellowD);--fg:#fff}
.btn.red{--c1:#ff8f9c;--c2:#ff4f66;--sd:var(--redD);--fg:#fff}
.btn.pur{--c1:#c4a8ff;--c2:#8a68f5;--sd:var(--purpleD);--fg:#fff}
.btn.sm{min-height:50px;padding:8px 18px;font-size:1em;border-radius:18px}
.btn[disabled]{filter:grayscale(.8);opacity:.55}
.btn .ic{width:1.5em;height:1.5em}
.fg-w{text-shadow:0 2px 0 rgba(0,0,0,.12)}
.card{background:rgba(255,255,255,.94);border-radius:var(--r-xl);padding:20px;box-shadow:var(--sh-card);position:relative}
h2{margin:4px 0 12px;font-size:1.32em;font-weight:900}
.muted{color:var(--ink2);font-size:.9em;font-weight:600}
.btnrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.bubbly{font-weight:900;color:#fff;letter-spacing:1px;paint-order:stroke fill}
/* ===== 角色动画 ===== */
svg.egg{display:block;width:100%;height:auto;overflow:visible}
.egg .bodyg{transform-box:fill-box;transform-origin:50% 100%;animation:idle 2.8s ease-in-out infinite}
.egg .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
.egg .flap-l{transform-box:fill-box;transform-origin:100% 60%;animation:flapL 1.6s ease-in-out infinite}
.egg .flap-r{transform-box:fill-box;transform-origin:0% 60%;animation:flapR 1.6s ease-in-out infinite}
.egg .sparkle path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.egg .sparkle path:nth-child(2){animation-delay:.6s}.egg .sparkle path:nth-child(3){animation-delay:1.2s}
.egg .toy{transform-box:fill-box;transform-origin:20% 100%;animation:sway 3s ease-in-out infinite}
.egg .orbit{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.4s linear infinite}
.egg.still .bodyg,.egg.still .eyes,.egg.still .toy,.egg.still .flap-l,.egg.still .flap-r,.egg.still .sparkle path{animation:none}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes flapL{50%{transform:rotate(-12deg)}}@keyframes flapR{50%{transform:rotate(12deg)}}
@keyframes twinkle{50%{transform:scale(.4);opacity:.4}}
@keyframes sway{50%{transform:rotate(-6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.egg.cheer .bodyg{animation:cheer .8s cubic-bezier(.3,.7,.4,1)}
@keyframes cheer{0%{transform:none}14%{transform:scale(1.18,.78)}42%{transform:translateY(-30%) scale(.88,1.14)}66%{transform:translateY(0) scale(1.16,.84)}82%{transform:scale(.96,1.04)}100%{transform:none}}
.egg.dizzy .bodyg{animation:dizzy .9s ease-in-out}
@keyframes dizzy{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
.egg.dance .bodyg{animation:dance .5s ease-in-out 6}
@keyframes dance{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-14deg) scale(1.05,.95)}50%{transform:translateY(-12%) scale(.95,1.06)}75%{transform:rotate(14deg) scale(1.05,.95)}}
.egg.boing .bodyg{animation:boing .6s cubic-bezier(.3,.7,.4,1)}
@keyframes boing{0%{transform:none}20%{transform:scale(1.2,.8)}50%{transform:translateY(-22%) scale(.9,1.12)}75%{transform:scale(1.08,.92)}100%{transform:none}}
.egg.hit .bodyg{animation:hit .5s}
@keyframes hit{20%{transform:translateX(-10%) rotate(-10deg) scale(.95,1.05)}50%{transform:translateX(8%) rotate(8deg)}80%{transform:translateX(-3%)}}
/* ===== 首页 ===== */
.home{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:stretch;min-height:100%;padding-bottom:8px}
.stage{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-card);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:440px;padding:16px}
.logo{position:absolute;top:10px;left:0;right:0;width:100%;height:auto;z-index:2;pointer-events:none}
.stage .hero{width:min(300px,62%);position:relative;z-index:2;margin-bottom:-6px}
.plate{position:relative;z-index:3;background:linear-gradient(#fff,#fff3fa);border-radius:22px;padding:8px 20px;box-shadow:0 5px 0 #ecd2e6;text-align:center;font-weight:900;font-size:1.12em}
.plate small{display:block;font-size:.72em;color:var(--ink2);font-weight:700}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.mbtn{--c1:#ff9ec0;--c2:#ff5c93;--sd:#d63a72;position:relative;min-height:128px;border-radius:30px;color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;
  background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 7px 0 var(--sd),0 14px 22px -10px rgba(80,20,80,.45);transition:transform .1s,box-shadow .1s;overflow:hidden}
.mbtn::before{content:"";position:absolute;left:8%;right:8%;top:6px;height:42%;border-radius:24px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.mbtn::after{content:"";position:absolute;right:-18px;bottom:-18px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}
.mbtn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--sd)}
.mbtn svg{width:72px;height:72px;flex:none;position:relative;z-index:1;filter:none}
.mbtn .tx{position:relative;z-index:1;font-size:1.3em;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.14);line-height:1.2}
.mbtn .tx small{display:block;font-size:.58em;font-weight:700;opacity:.95;margin-top:3px}
.m-adv{--c1:#ffb08a;--c2:#ff5f7e;--sd:#d43c5c}.m-race{--c1:#8fd0ff;--c2:#4f86ff;--sd:#3060d0}.m-pet{--c1:#ffe07a;--c2:#ffad33;--sd:#d98612}
.m-gacha{--c1:#d4b8ff;--c2:#9b6bff;--sd:#7046d8}.m-rev{--c1:#8ff0c8;--c2:#25bf8a;--sd:#169068}.m-wrong{--c1:#ffb3d9;--c2:#f06aa8;--sd:#c84586}
.badge{position:absolute;top:8px;right:10px;z-index:2;min-width:34px;height:34px;padding:0 9px;border-radius:17px;background:linear-gradient(#ff7a7a,#f0383f);color:#fff;font-size:.85em;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.2);animation:badgeP 1.6s ease-in-out infinite}
@keyframes badgeP{50%{transform:scale(1.12)}}
.parentLink{margin-top:16px;width:100%;position:relative;overflow:hidden;min-height:56px;font-size:1em}
.parentLink .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd6e6,#ffc0d8);z-index:0}
.parentLink span{position:relative;z-index:1}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.statrow .pill{font-size:.9em;padding:6px 12px 6px 6px}
/* ===== 舞台背景 ===== */
.bg-party{background:radial-gradient(ellipse at 50% 108%,#ffffff 0,#ffe0ef 30%,transparent 31%),radial-gradient(circle at 50% -10%,#fff7c2 0,transparent 55%),linear-gradient(180deg,#b9a2ff 0%,#ffb3d6 60%,#ffd6e8 100%)}
.bg-garden{background:radial-gradient(ellipse at 50% 112%,#7ad35a 0,#9fe08f 36%,transparent 37%),linear-gradient(180deg,#bfe9ff,#e6fbff 60%,#c9f2c0)}
.bg-rainbow{background:radial-gradient(circle at 50% 120%,transparent 38%,#ff9ec0 38%,#ff9ec0 43%,#ffd84d 43%,#ffd84d 48%,#86e8bf 48%,#86e8bf 53%,#8fd0ff 53%,#8fd0ff 58%,#c4a3ff 58%,#c4a3ff 63%,transparent 63%),linear-gradient(180deg,#fff2fa,#fffbe8)}
.bg-beach{background:radial-gradient(ellipse at 50% 112%,#ffd77a 0,#ffe7a8 36%,transparent 37%),linear-gradient(180deg,#7fd0ff 0,#c9eeff 55%,#5ec4e8 56%,#8fdcf2 70%,#ffe7a8 71%)}
.bg-night{background:radial-gradient(circle at 78% 18%,#fff6c2 0,#fff6c2 5%,transparent 5.5%),radial-gradient(ellipse at 50% 112%,#5a4bd6 0,#4135a8 36%,transparent 37%),linear-gradient(180deg,#1d1b52,#4b3d9a)}
.bg-candy{background:radial-gradient(ellipse at 50% 112%,#ffc4dc 0,#ffe0ee 36%,transparent 37%),repeating-linear-gradient(45deg,#fff0f7 0 22px,#ffe1ef 22px 44px)}
.bunting{position:absolute;top:0;left:0;width:100%;height:auto;z-index:1;pointer-events:none}
.spot{position:absolute;bottom:0;left:50%;width:70%;height:22%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 60%,rgba(255,255,255,.75),transparent 70%);z-index:1;pointer-events:none}
/* ===== 地图 ===== */
.worlds{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.wtab{display:flex;align-items:center;gap:8px;border-radius:24px;padding:8px 10px;background:linear-gradient(#fff,#f7eff9);box-shadow:0 5px 0 #e3cfe8;font-weight:900;position:relative;text-align:left;transition:transform .1s}
.wtab:active{transform:translateY(4px);box-shadow:0 1px 0 #e3cfe8}
.wtab svg{width:52px;height:52px;flex:none}
.wtab .st{display:flex;align-items:center;gap:2px;font-size:.8em;color:#d48a00}
.wtab .st .ic{width:1.1em;height:1.1em}
.wtab.sel{background:linear-gradient(#ffe3ef,#ffd0e4);box-shadow:0 5px 0 #f0a8c8,0 0 0 4px #ff8fb6}
.wtab.lock{filter:grayscale(1);opacity:.6}
.course{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-card);aspect-ratio:1000/560;width:100%}
.course svg.bgmap{position:absolute;inset:0;width:100%;height:100%}
.cloud{position:absolute;pointer-events:none;opacity:.9;will-change:transform}
.cloud.c1{top:6%;width:16%;animation:drift 48s linear infinite}.cloud.c2{top:20%;width:11%;animation:drift 70s linear infinite -30s;opacity:.7}.cloud.c3{top:3%;width:9%;animation:drift 90s linear infinite -60s;opacity:.6}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.wname{position:absolute;top:3%;left:50%;transform:translateX(-50%);z-index:3;width:60%;height:auto;pointer-events:none}
.node{position:absolute;width:13%;transform:translate(-50%,-78%);display:flex;flex-direction:column;align-items:center;z-index:4}
.node .stars{display:flex;gap:1px;height:1.6em;margin-bottom:2px}
.node .stars .ic{width:1.45em;height:1.45em}
.node .stars .ic:nth-child(2){transform:translateY(-5px)}
.node .disc{width:100%;aspect-ratio:1;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-size:2.1em;font-weight:900;color:#fff;
  background:radial-gradient(circle at 35% 28%,#fff 0,#fff 6%,transparent 7%),radial-gradient(circle at 50% 40%,#ffd970,#ffaa2b 70%,#e2860f);box-shadow:0 7px 0 #c26f00,0 12px 18px -6px rgba(0,0,0,.4),inset 0 -6px 0 rgba(0,0,0,.08);text-shadow:0 3px 0 rgba(180,90,0,.55);transition:transform .1s}
.node:active .disc{transform:translateY(4px)}
.node.done .disc{background:radial-gradient(circle at 35% 28%,#fff 0,#fff 6%,transparent 7%),radial-gradient(circle at 50% 40%,#9ff5cf,#2fc48f 70%,#1f9e75);box-shadow:0 7px 0 #17775a,0 12px 18px -6px rgba(0,0,0,.4);text-shadow:0 3px 0 rgba(0,90,60,.5)}
.node.lock .disc{background:radial-gradient(circle at 50% 40%,#f1edf6,#cfc6dc 70%,#b3a8c4);box-shadow:0 7px 0 #8f849f,0 12px 18px -6px rgba(0,0,0,.3)}
.node.lock .disc .ic{width:48%;height:48%}
.node.bossn{width:16%}
.node.bossn .disc{background:radial-gradient(circle at 50% 40%,#ff9fb0,#ff4f66 70%,#c22a44);box-shadow:0 7px 0 #8d1b30,0 12px 18px -6px rgba(0,0,0,.45)}
.node.bossn .disc svg.egg{width:84%;margin-top:-18%}
.node.cur .disc{animation:nodePulse 1.4s ease-in-out infinite}
@keyframes nodePulse{0%,100%{box-shadow:0 7px 0 #c26f00,0 0 0 0 rgba(255,255,255,.8)}50%{box-shadow:0 7px 0 #c26f00,0 0 0 12px rgba(255,255,255,0)}}
.node .nm{margin-top:10px;background:linear-gradient(#fff,#fbf2fb);border-radius:14px;padding:4px 10px;font-weight:900;font-size:.82em;box-shadow:0 3px 0 rgba(0,0,0,.12);white-space:nowrap}
.node .un{margin-top:4px;font-size:.66em;font-weight:800;color:#fff;background:rgba(40,20,60,.42);border-radius:10px;padding:2px 7px;text-align:center;line-height:1.25;max-width:150%}
.avatar{position:absolute;width:9%;z-index:6;transform:translate(-50%,-128%);transition:left .9s cubic-bezier(.4,0,.3,1),top .9s cubic-bezier(.4,0,.3,1);pointer-events:none}
.avatar .hopper{animation:hop .45s ease-in-out infinite alternate}
.avatar.moving .hopper{animation:hopBig .3s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-10%)}}@keyframes hopBig{to{transform:translateY(-30%) scale(.95,1.05)}}
.lockmsg{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);z-index:5;width:min(460px,80%);text-align:center}
.maptip{text-align:center;margin-top:10px}
.w-math{background:linear-gradient(180deg,#9be7ff 0%,#d8f6ff 55%,#c6f2c8 100%)}
.w-chinese{background:linear-gradient(180deg,#ffc6d9 0%,#ffe6ef 55%,#ffe2c9 100%)}
.w-english{background:linear-gradient(180deg,#7fd6ff 0%,#c9f0ff 55%,#9fe6f0 100%)}
.w-mix{background:linear-gradient(180deg,#2b2470 0%,#5a48b8 55%,#8a6fe0 100%)}
@keyframes isl{50%{transform:translateY(-8px)}}
@keyframes padj{to{transform:translateY(-6px)}}
.spinbar{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.wname svg{width:100%;height:auto;display:block}
/* ===== 答题 ===== */
.qgrid{display:grid;grid-template-columns:240px 1fr;gap:18px;max-width:1060px;margin:0 auto;min-height:100%}
.buddy{display:flex;flex-direction:column;align-items:center;gap:10px}
.buddy .eggbox{width:100%;position:relative}
.speech{position:relative;background:#fff;border-radius:20px;padding:10px 14px;font-weight:900;text-align:center;box-shadow:0 5px 0 #ecd6ea;min-height:48px;display:flex;align-items:center;justify-content:center;width:100%}
.speech::after{content:"";position:absolute;bottom:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.combo{width:100%;background:#fff;border-radius:20px;padding:10px 12px;box-shadow:0 5px 0 #ecd6ea}
.combo .row{display:flex;align-items:center;gap:6px;font-weight:900}
.combo .row .ic{width:1.6em;height:1.6em}
.combo .segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.combo .segs i{height:12px;border-radius:6px;background:#f2e8f4}
.combo .segs i.on{background:linear-gradient(90deg,#ffb347,#ff5c6e)}
.combo.hot{animation:bump .4s}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;background:#efe4f3;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.dots i.ok{background:radial-gradient(circle at 35% 30%,#c9ffe9,#2fc48f)}.dots i.no{background:radial-gradient(circle at 35% 30%,#ffd0d6,#ff4f66)}.dots i.cur{background:radial-gradient(circle at 35% 30%,#fff,#ffc93c);transform:scale(1.25)}
.qmain{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:6px 12px;font-size:.8em;font-weight:900;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.t-math{background:linear-gradient(#5fdc8c,#25a865)}.t-chinese{background:linear-gradient(#ff8f9c,#e5476a)}.t-english{background:linear-gradient(#7cc4ff,#3a86e0)}
.bossbar{display:flex;align-items:center;gap:12px;background:linear-gradient(#fff,#fff3f5);border-radius:24px;padding:6px 16px 6px 6px;box-shadow:0 5px 0 #f3cdd6}
.bossbar .bimg{width:84px;flex:none}
.hp{height:22px;background:#ffe3e8;border-radius:11px;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.08);margin-top:4px}
.hp i{display:block;height:100%;background:linear-gradient(#ff8f9c,#ff4f66);border-radius:11px;transition:width .45s cubic-bezier(.3,.8,.3,1.2);position:relative}
.hp i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:6px;border-radius:3px;background:rgba(255,255,255,.55)}
.qtext{font-size:1.5em;font-weight:900;line-height:1.55;background:linear-gradient(#fff,#fffafc);border-radius:30px;padding:24px 26px;box-shadow:0 7px 0 #ecd6ea,0 14px 24px -14px rgba(120,40,110,.4);position:relative}
.speak{margin-left:10px;vertical-align:middle}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{position:relative;min-height:88px;border-radius:26px;font-size:1.28em;font-weight:900;padding:12px 18px 12px 66px;text-align:left;line-height:1.3;color:var(--ink);
  background:linear-gradient(#fff,#f7eefb);box-shadow:0 7px 0 #e2cfe8,0 12px 18px -10px rgba(80,20,80,.35);transition:transform .1s,box-shadow .1s;overflow:hidden}
.opt::after{content:"";position:absolute;left:58px;right:14px;top:6px;height:34%;border-radius:18px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.opt .lt{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85em;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 2px 0 rgba(0,0,0,.1)}
.opt:nth-child(1) .lt{background:linear-gradient(#ff9ec0,#ff5c93)}.opt:nth-child(2) .lt{background:linear-gradient(#ffe07a,#ffaa2b)}.opt:nth-child(3) .lt{background:linear-gradient(#8ff0c8,#25bf8a)}.opt:nth-child(4) .lt{background:linear-gradient(#a8d8ff,#4f9cff)}
.opt:active{transform:translateY(6px);box-shadow:0 1px 0 #e2cfe8}
.opt.ok{background:linear-gradient(#8ff5c8,#2fc48f);color:#fff;box-shadow:0 7px 0 #17775a;animation:pop .45s}
.opt.no{background:linear-gradient(#ff9fab,#ff4f66);color:#fff;box-shadow:0 7px 0 #a8203a;animation:shake .45s}
.opt.ok .lt,.opt.no .lt{background:#fff!important;color:var(--ink)}
.opt.dim{opacity:.55}
@keyframes pop{40%{transform:scale(1.06)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.fillbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.ans{min-width:260px;min-height:78px;border-radius:24px;background:#fff;border:4px dashed #ffb3cf;font-size:2.1em;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 20px;box-shadow:inset 0 4px 0 rgba(0,0,0,.04)}
.ans.ok{border:4px solid #2fc48f;color:#1f9e75;animation:pop .45s}.ans.no{border:4px solid #ff4f66;color:#d02c48;animation:shake .45s}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(470px,100%)}
.pad button{min-height:66px;border-radius:20px;background:linear-gradient(#fff,#f5ecf9);font-size:1.6em;font-weight:900;box-shadow:0 6px 0 #e2cfe8;transition:transform .08s}
.pad button:active{transform:translateY(5px);box-shadow:0 1px 0 #e2cfe8}
.pad .ok{background:linear-gradient(#8ff5c8,#2fc48f);color:#fff;box-shadow:0 6px 0 #17775a;font-size:1.15em}
/* 反馈面板 */
#sheet{position:fixed;left:0;right:0;bottom:0;transform:translateY(115%);transition:transform .38s cubic-bezier(.2,.9,.3,1.2);z-index:30;padding:16px 24px calc(18px + env(safe-area-inset-bottom));border-radius:34px 34px 0 0;box-shadow:0 -10px 30px rgba(80,20,80,.2)}
#sheet.on{transform:none}
#sheet.good{background:linear-gradient(#e6fff3,#c9f7e2)}#sheet.bad{background:linear-gradient(#fff1ec,#ffe0e0)}
#sheet .row{display:flex;align-items:center;gap:16px;max-width:1000px;margin:0 auto}
#sheet .mini{width:92px;flex:none}
#sheet .msg{flex:1}
#sheet .big{font-size:1.45em;font-weight:900}
#sheet.good .big{color:#14845e}#sheet.bad .big{color:#c8344f}
#sheet .exp{margin-top:6px;line-height:1.55;font-weight:700}
/* ===== 结算 ===== */
.result{max-width:760px;margin:0 auto;text-align:center;padding-top:6px}
.result .ttl{margin:0;width:100%;height:auto}
.bigstars{display:flex;justify-content:center;gap:4px;margin:-6px 0 4px}
.bigstars .ic{width:94px;height:94px;animation:starIn .6s cubic-bezier(.3,1.6,.5,1) both}
.bigstars .ic:nth-child(2){width:116px;height:116px;transform:translateY(-14px);animation-delay:.3s}.bigstars .ic:nth-child(3){animation-delay:.6s}
@keyframes starIn{from{transform:scale(0) rotate(-140deg);opacity:0}}
.bigstars .ic:nth-child(2){animation-name:starIn2}@keyframes starIn2{from{transform:scale(0) rotate(-140deg) translateY(-14px);opacity:0}to{transform:translateY(-14px)}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:4px auto 0;max-width:540px}
.pcol{flex:1;display:flex;flex-direction:column;align-items:center}
.pcol .pe{width:82%;margin-bottom:-6px;position:relative;z-index:2}
.pcol .pb{width:100%;border-radius:18px 18px 8px 8px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:1.9em;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.pcol .pb::after{content:"";position:absolute;left:8%;right:8%;top:5px;height:22%;border-radius:12px;background:rgba(255,255,255,.4)}
.pcol.p1 .pb{height:120px;background:linear-gradient(#ffe07a,#ffaa2b);box-shadow:0 6px 0 #c97a10}
.pcol.p2 .pb{height:86px;background:linear-gradient(#eef1f8,#b7bed4);box-shadow:0 6px 0 #8890a8}
.pcol.p3 .pb{height:64px;background:linear-gradient(#ffd0a8,#e5945a);box-shadow:0 6px 0 #a8612e}
.pcol .pn{font-size:.8em;font-weight:900;margin-bottom:4px;background:#fff;border-radius:10px;padding:2px 8px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.trophy{width:64px;margin-bottom:2px;animation:bob 1.8s ease-in-out infinite}.trophy svg{width:100%;height:auto;display:block}
@keyframes bob{50%{transform:translate(-50%,-8px)}}
.rewards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.rewards .pill{font-size:1.15em;padding:8px 18px 8px 10px;animation:starIn .5s both;animation-delay:.9s}
/* ===== 宠物 ===== */
.petwrap{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;min-height:100%}
.petstage{min-height:460px}
.petstage .hero{width:min(330px,70%)}
.mood{position:absolute;top:14px;right:14px;z-index:4;background:#fffd;border-radius:16px;padding:6px 12px;font-weight:900;font-size:.9em;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bars{display:grid;gap:12px;margin:6px 0 4px}
.bar{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:10px;font-weight:900}
.bar .tr{height:22px;background:#f3e6f2;border-radius:11px;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.06)}
.bar .tr i{display:block;height:100%;border-radius:11px;transition:width .5s;position:relative}
.bar .tr i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:6px;border-radius:3px;background:rgba(255,255,255,.5)}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tabs button{flex:1;min-height:54px;border-radius:20px;background:linear-gradient(#fff,#f7eff9);box-shadow:0 5px 0 #e3cfe8;font-size:1.05em}
.tabs button.sel{background:linear-gradient(#ff9ec0,#ff5c93);color:#fff;box-shadow:0 5px 0 #d63a72}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:44px;padding:4px 14px;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e8d6ec;font-size:.92em}
.chips button.sel{background:linear-gradient(#c4a8ff,#8a68f5);color:#fff;box-shadow:0 3px 0 #6c4ad8}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.item{position:relative;background:linear-gradient(#fff,#faf4fc);border-radius:22px;padding:6px 6px 8px;text-align:center;box-shadow:0 5px 0 #e8d6ec;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:900;font-size:.88em;transition:transform .1s}
.item:active{transform:translateY(4px)}
.item .th{width:84%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:16px;background:radial-gradient(circle at 50% 70%,#fff,#f3e9f7)}
.item .th svg.egg{width:100%}
.item .pr{display:flex;align-items:center;gap:3px;font-size:.92em;color:#d48a00}
.item .pr .ic{width:1.2em;height:1.2em}
.item.eq{background:linear-gradient(#e6fff3,#c9f7e2);box-shadow:0 5px 0 #8fdcb8,0 0 0 3px #2fc48f}
.item.lockd .th{opacity:.45;filter:grayscale(.7)}
.item .rar{position:absolute;top:6px;left:6px;font-size:.7em;color:#fff;border-radius:8px;padding:1px 6px}
.swatch{width:100%;height:100%;border-radius:14px}
/* ===== 扭蛋机 ===== */
.gacha{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.machine{width:min(380px,90%);margin:0 auto;display:block}
.machine.shake{animation:mshake .7s}
@keyframes mshake{15%,45%,75%{transform:rotate(-3deg) translateX(-4px)}30%,60%,90%{transform:rotate(3deg) translateX(4px)}}
.machine .knob{transform-box:fill-box;transform-origin:center}
.machine.shake .knob{animation:spin .7s}
.reveal{position:relative;width:240px;margin:0 auto}
.cap-t,.cap-b{transform-box:fill-box;transform-origin:center}
.opening .cap-t{animation:capT .7s .5s forwards}.opening .cap-b{animation:capB .7s .5s forwards}
.opening .capall{animation:capShake .5s}
@keyframes capShake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes capT{to{transform:translate(-30px,-80px) rotate(-40deg);opacity:0}}@keyframes capB{to{transform:translate(30px,80px) rotate(30deg);opacity:0}}
.prize{opacity:0;transform:scale(.3);animation:prizeIn .6s 1s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes prizeIn{to{opacity:1;transform:none}}
.rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,rgba(255,230,120,.55) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);opacity:0;animation:spin 8s linear infinite,fadein .4s 1s forwards}
@keyframes fadein{to{opacity:1}}
.colgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.colgrid .cg{aspect-ratio:1;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e8d6ec;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.colgrid .cg svg.egg{width:96%}
.colgrid .cg.no svg.egg{opacity:.18;filter:grayscale(1)}
.colgrid .cg b{position:absolute;font-size:1.6em;color:#c9bfdc}
/* ===== 派对赛 ===== */
.track{background:linear-gradient(#7fd27a,#55b85a);border-radius:28px;padding:10px 12px;box-shadow:0 7px 0 #3a8f3f,var(--sh-card);position:relative}
.lane{position:relative;height:66px;margin:6px 0;border-radius:18px;background:repeating-linear-gradient(90deg,#ffb3cf 0 40px,#ffc9dc 40px 80px);box-shadow:inset 0 4px 0 rgba(0,0,0,.08)}
.lane:nth-child(2){background:repeating-linear-gradient(90deg,#ffe48f 0 40px,#fff0b8 40px 80px)}.lane:nth-child(3){background:repeating-linear-gradient(90deg,#a8f0cf 0 40px,#c9f7e2 40px 80px)}.lane:nth-child(4){background:repeating-linear-gradient(90deg,#b5dcff 0 40px,#d3eaff 40px 80px)}
.lane .fin{position:absolute;right:0;top:0;bottom:0;width:26px;border-radius:0 18px 18px 0;background:repeating-conic-gradient(#33203f 0 25%,#fff 0 50%) 0 0/13px 13px}
.lane .runner{position:absolute;left:0;top:-14px;width:76px;will-change:transform}
.lane .runner .egg .bodyg{animation-duration:.5s}
.lane .rn{position:absolute;left:8px;bottom:3px;font-size:.72em;font-weight:900;color:#5a3d6a;background:#ffffffc0;border-radius:8px;padding:0 6px}
.lane.me{box-shadow:inset 0 4px 0 rgba(0,0,0,.08),0 0 0 4px #fff}
.racegrid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none}
.count b{font-size:9em;color:#fff;-webkit-text-stroke:0;text-shadow:0 8px 0 #ff5c93,0 14px 30px rgba(0,0,0,.25);animation:countIn .9s both}
@keyframes countIn{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.6);opacity:0}}
/* ===== 列表 / 家长 ===== */
.wlist{display:grid;gap:12px}
.witem{background:#fff;border-radius:22px;padding:14px 18px;box-shadow:0 5px 0 #eedcef}
.witem .q{font-weight:900;margin-top:8px}
.witem .a{color:#14845e;font-weight:900;margin-top:6px}
.witem .m{font-size:.82em;color:var(--ink2);margin-top:6px;line-height:1.5}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:52px;padding:6px 18px;border-radius:16px;background:linear-gradient(#fff,#f5ecf9);box-shadow:0 4px 0 #e3cfe8}
.seg button.sel{background:linear-gradient(#ff9ec0,#ff5c93);color:#fff;box-shadow:0 4px 0 #d63a72}
.acc{display:grid;grid-template-columns:60px 1fr 120px;gap:10px;align-items:center;margin:10px 0;font-weight:900}
table{width:100%;border-collapse:collapse;font-size:.86em}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
textarea{width:100%;min-height:90px;border-radius:16px;border:2px solid #f0d3e2;padding:10px;font-family:monospace;font-size:13px;margin-top:10px}
.revhero{display:flex;align-items:center;gap:20px;text-align:left}
.revhero .egg{width:160px;flex:none}
/* ===== 弹窗/提示/彩带 ===== */
#modal{position:fixed;inset:0;background:rgba(60,20,70,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#modal.on{display:flex}
#modal .box{background:linear-gradient(#fff,#fff6fb);border-radius:36px;padding:26px;max-width:540px;width:100%;text-align:center;animation:boxIn .45s cubic-bezier(.3,1.5,.5,1);box-shadow:0 20px 50px rgba(60,20,70,.35);max-height:92vh;overflow:auto}
@keyframes boxIn{from{transform:scale(.6);opacity:0}}
#modal .mega{width:150px;margin:-10px auto 0}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);background:rgba(59,42,74,.92);color:#fff;padding:12px 24px;border-radius:30px;font-weight:900;z-index:70;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.float{position:fixed;font-size:1.5em;font-weight:900;pointer-events:none;z-index:50;animation:floatUp 1s forwards;display:flex;align-items:center;gap:4px;color:#ff8a00;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}

@keyframes floatUp{0%{transform:translateY(0) scale(.6)}20%{transform:translateY(-10px) scale(1.15)}100%{transform:translateY(-90px);opacity:0}}
.cf{position:fixed;top:-24px;z-index:55;pointer-events:none;border-radius:3px;will-change:transform;animation:cfFall var(--d,2s) cubic-bezier(.25,.4,.6,1) forwards}
@keyframes cfFall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
.burst{position:fixed;z-index:55;pointer-events:none;width:10px;height:10px;border-radius:50%;animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
/* ===== 竖屏 ===== */
@media (orientation:portrait){
  .home{grid-template-columns:1fr;gap:16px;align-content:start}
  .stage{min-height:400px}
  .menu{grid-template-columns:1fr 1fr}
  .mbtn{min-height:100px}
  .petwrap,.gacha,.pgrid{grid-template-columns:1fr}
  .petstage{min-height:400px}
  .qgrid{grid-template-columns:1fr;gap:12px;min-height:0;align-content:start}

.ptable td:nth-child(-n+2),.ptable th:nth-child(-n+2),table td:nth-child(-n+2),table th:nth-child(-n+2){white-space:nowrap}
/* ===== v3 派对广场 + 动作模式 ===== */

#s-act{padding:0;overflow:hidden}
.actw{position:absolute;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}

.ahud{position:absolute;left:12px;right:12px;top:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:3}
.ahud>div{display:flex;gap:8px;flex-wrap:wrap}
.achip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border-radius:18px;padding:5px 12px 5px 7px;font-weight:900;box-shadow:0 3px 0 rgba(90,40,110,.12)}
.achip .ic{width:24px;height:24px}.achip.rk{background:linear-gradient(#fff6c8,#ffe07a)}
.achip.hp{gap:1px;padding:5px 9px}

const STAGE_SCALE = [0.8, 0.88, 0.95, 1.0];
/* o: {skin, expr, hat, face, costume, wings, toy, stage, cls, style, still} */
function eggSVG(o = {}) {
  const id = "e" + (++_eid), skin = SKINS[o.skin] ? o.skin : "peach", c = SKINS[skin].c, st = o.stage == null ? 2 : o.stage;
  const fillB = `url(#sk-${skin})`, foot = skin === "rainbow" ? "#b48cff" : c[2];
  const cos = o.costume && PARTS.costume[o.costume];
  let s = `<svg ${SVGNS} class="egg ${o.cls || ""} ${o.still ? "still" : ""}" viewBox="-10 -10 220 230" style="${o.style || ""}" aria-hidden="true">`;
  s += `<ellipse cx="100" cy="207" rx="62" ry="9" fill="#40103a" opacity=".14"/>`;
  s += `<g class="bodyg" transform="translate(100 206) scale(${STAGE_SCALE[st]}) translate(-100 -206)">`;
  if (o.wings && PARTS.wings[o.wings]) s += `<g class="wings">${PARTS.wings[o.wings]}</g>`;
  if (cos && cos.back) s += cos.back;
  if (st >= 1) s += `<ellipse cx="70" cy="200" rx="21" ry="11" fill="${foot}"/><ellipse cx="130" cy="200" rx="21" ry="11" fill="${foot}"/><ellipse cx="66" cy="196" rx="8" ry="3" fill="#fff" opacity=".35"/><ellipse cx="126" cy="196" rx="8" ry="3" fill="#fff" opacity=".35"/>`;
  s += `<clipPath id="${id}c"><path d="${BODY}"/></clipPath>`;
  s += `<path d="${BODY}" fill="${fillB}" stroke="${c[2]}" stroke-opacity=".35" stroke-width="2"/>`;
  if (skin === "galaxy") s += `<g clip-path="url(#${id}c)" fill="#fff">${[[60, 80, 2], [130, 70, 2.5], [150, 120, 1.8], [50, 150, 2.2], [90, 180, 1.6], [140, 170, 2.4], [110, 60, 1.5], [70, 120, 1.4]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}"/>`).join("")}<path d="${starPath(150, 95, 6)}" fill="#ffe680"/><path d="${starPath(58, 175, 5)}" fill="#ffe680"/></g>`;
  if (cos && cos.front) s += `<g clip-path="url(#${id}c)">${cos.front}</g>`;
  s += `<path d="${BODY}" fill="url(#shade)"/><path d="${BODY}" fill="url(#rim)"/>`;
  s += `<ellipse cx="72" cy="80" rx="24" ry="14" fill="url(#gloss)" transform="rotate(-32 72 80)"/><circle cx="56" cy="104" r="5" fill="#fff" opacity=".75"/>`;
  if (st === 0) s += `<path d="M28 156 L40 146 L52 160 L66 144 L80 160 L94 144 L108 160 L122 144 L136 160 L150 146 L162 158 L172 150 C172 186 142 206 100 206 C58 206 28 186 28 156 Z" fill="#fffaf2" stroke="#ead9bf" stroke-width="3" stroke-linejoin="round"/><circle cx="70" cy="184" r="5" fill="#ffe2b0"/><circle cx="128" cy="178" r="6" fill="#ffe2b0"/><path d="M44 172 q10 -4 16 0" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  s += `<g class="face">${faceSVG(o.expr)}</g>`;
  if (o.face && PARTS.face[o.face]) s += PARTS.face[o.face];
  if (cos && cos.over) s += cos.over;
  if (st >= 2) s += `<ellipse cx="34" cy="156" rx="12" ry="16" fill="${fillB}" transform="rotate(25 34 156)" stroke="${c[2]}" stroke-opacity=".35" stroke-width="2"/><ellipse cx="166" cy="156" rx="12" ry="16" fill="${fillB}" transform="rotate(-25 166 156)" stroke="${c[2]}" stroke-opacity=".35" stroke-width="2"/>`;
  if (o.hat && PARTS.hat[o.hat]) s += `<g class="hat">${PARTS.hat[o.hat]}</g>`;
  s += `</g>`;
  if (o.toy && PARTS.toy[o.toy]) s += `<g class="toy">${PARTS.toy[o.toy]}</g>`;
  if (st >= 3) s += `<g class="sparkle"><path d="${starPath(18, 60, 9)}" fill="#ffd447"/><path d="${starPath(186, 30, 7)}" fill="#ffd447"/><path d="${starPath(8, 150, 6)}" fill="#ff8fb6"/></g>`;
  return s + "</svg>";
}

function holdToEnter(el, fn) {

function startRace() {
  const pool = shuffle(Q.filter(q => bookOK(q) && q.t === "c"));
  RC = { pos: [0, 0, 0, 0], spd: [0, 1, 2].map(() => 1 / (62 + Math.random() * 30)), order: [], need: 8, right: 0, total: 0, qs: pool, qi: 0, paused: true, done: false, combo: 0, coins: 0, xp: 0, target: 0 };
  $("#s-race").innerHTML = `<div class="racegrid">
    <div class="track" id="track">${[0, 1, 2, 3].map(k => `<div class="lane ${k === 0 ? "me" : ""}"><div class="fin"></div><span class="rn">${k === 0 ? esc(S.pet.name) : NPCS[k - 1].name}</span><div class="runner" id="run${k}">${k === 0 ? eggSVG(petLook({ expr: "happy" })) : eggSVG(Object.assign({ expr: "normal" }, NPCS[k - 1]))}</div></div>`).join("")}</div>
    <div id="raceQ"></div></div>`;
  show("race", "派对赛", () => confirmBox({ expr: "sad" }, "比赛还没结束，确定要离开吗？", "离开", renderHome));
  raceQ();
  const cd = document.createElement("div"); cd.className = "count"; document.body.appendChild(cd);
  ["3", "2", "1", "GO!"].forEach((t, i) => setTimeout(() => { cd.innerHTML = `<b>${t}</b>`; SND.beep(i === 3); if (i === 3) { setTimeout(() => cd.remove(), 800); RC.paused = false; } }, i * 800));
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (!RC.paused && !RC.done) {
      for (let k = 1; k < 4; k++) if (RC.pos[k] < 1) { RC.pos[k] = Math.min(1, RC.pos[k] + RC.spd[k - 1] * dt * (.75 + .5 * Math.abs(Math.sin(now / 900 + k * 2)))); if (RC.pos[k] >= 1) { RC.order.push(k); SND.pop(); } }
      if (RC.order.length >= 3 && !RC.order.includes(0)) endRace();
    }
    RC.pos[0] += (RC.target - RC.pos[0]) * Math.min(1, dt * 6);
    const tr = $("#track"); if (tr) { const lw = tr.querySelector(".lane").offsetWidth - 76 - 22; for (let k = 0; k < 4; k++) { const r = $("#run" + k); if (r) r.style.transform = `translateX(${RC.pos[k] * lw}px)`; } }
    raceLoop = requestAnimationFrame(loop);
  };
  raceLoop = requestAnimationFrame(loop);
}
function raceQ() {
  if (RC.qi >= RC.qs.length) { RC.qs = shuffle(RC.qs); RC.qi = 0; }
  const q = RC.qs[RC.qi++]; RC.cur = q; RC.locked = false;
  const isEn = q.s === "english" && /[A-Za-z]{3,}/.test(q.q), ord = shuffle([0, 1, 2, 3]);
  $("#raceQ").innerHTML = `<div class="qmain"><div class="qhead"><span class="tag t-${q.s}">${esc(tagText(q))}</span><b style="margin-left:auto">前进 ${RC.right}/${RC.need} 步${RC.combo >= 2 ? ` · 连击×${RC.combo}` : ""}</b></div>
    <div class="qtext" style="padding:16px 22px">${esc(q.q)}${isEn ? `<button class="btn sm blu speak" id="spk">${IC.sound} 读一读</button>` : ""}</div>
    <div class="opts">${ord.map((k, j) => `<button class="opt" data-k="${k}"><span class="lt">${"ABCD"[j]}</span>${esc(q.o[k])}</button>`).join("")}</div></div>`;
  if (isEn) $("#spk").onclick = () => speak(q.q);
  $$("#raceQ .opt").forEach(b => b.onclick = e => raceAnswer(+b.dataset.k === 0, b, e));
}
function raceAnswer(ok, el, e) {
  if (RC.locked || RC.done || RC.paused) return; RC.locked = true; RC.total++;
  const q = RC.cur; recordAnswer(q, ok, RC);
  if (ok) {
    RC.right++; RC.combo++; RC.coins += 1; RC.xp += 3; S.coins += 1; gainXP(3); RC.target = Math.min(1, RC.right / RC.need);
    el.classList.add("ok"); SND.combo(RC.combo); const rc = el.getBoundingClientRect(); burst(e && e.clientX || rc.left + rc.width / 2, e && e.clientY || rc.top + rc.height / 2, 10);
    $("#run0").innerHTML = eggSVG(petLook({ expr: "excited" })); animEgg($("#run0"), "boing", 600);
    if (RC.right >= RC.need) { RC.order.push(0); setTimeout(endRace, 900); }
    else setTimeout(raceQ, 650);
  } else {
    RC.combo = 0; RC.paused = true; el.classList.add("no"); SND.no();

    showSheet(false, `<div class="big">比赛暂停，看一看讲解</div><div class="exp">正确答案：<b style="color:#14845e;font-size:1.2em">${esc(correctText(q))}</b><br>${esc(q.e)}</div>`, "sad",
      () => { $("#run0").innerHTML = eggSVG(petLook({ expr: "happy" })); RC.paused = false; raceQ(); }, "继续比赛");
  }
  save();
}
function endRace() {
  if (RC.done) return; RC.done = true; hideSheet();
  const rank = RC.order.includes(0) ? RC.order.indexOf(0) + 1 : 4, prize = [30, 20, 12, 8][rank - 1], food = rank <= 2 ? 1 : 0;
  S.coins += prize; S.food += food; S.races.n++; if (rank === 1) S.races.win++; save();
  setTimeout(() => renderResult({ title: rank === 1 ? "冠军！" : `第 ${rank} 名！`, stars: null, pass: rank <= 3, rank: rank <= 3 ? rank : 0, line: `答对 <b>${RC.right}</b> / ${RC.total} 题`, coins: prize + RC.coins, food, xp: RC.xp,

}
